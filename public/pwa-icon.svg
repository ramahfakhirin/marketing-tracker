<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1262FF" />
      <stop offset="100%" stop-color="#023AC4" />
    </linearGradient>

    <!-- Subtle Shine Overlay -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Card Badge Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001868" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Main Squircle Container -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#shineGrad)" />

  <!-- Top Section: "nano" 2x2 Logo -->
  <g transform="translate(138, 70)" fill="#FFFFFF">
    <!-- Top Row: n  a -->
    <!-- Letter 'n' (left) -->
    <path d="M 12,100 V 28 C 12,12 25,0 42,0 C 59,0 72,12 72,28 V 100 H 50 V 32 C 50,22 45,18 42,18 C 39,18 34,22 34,32 V 100 Z" />
    
    <!-- Letter 'a' (right) -->
    <path d="M 170,100 H 150 V 88 C 142,98 128,104 112,104 C 86,104 68,88 68,64 C 68,40 88,26 126,26 H 148 V 22 C 148,14 138,10 126,10 C 114,10 102,14 96,20 L 86,5 C 98,-3 116,-8 132,-8 C 160,-8 170,8 170,28 Z M 148,42 H 128 C 104,42 90,50 90,64 C 90,76 100,84 114,84 C 132,84 148,72 148,56 Z" />

    <!-- Bottom Row: n  o -->
    <!-- Letter 'n' (left) -->
    <path d="M 12,220 V 148 C 12,132 25,120 42,120 C 59,120 72,132 72,148 V 220 H 50 V 152 C 50,142 45,138 42,138 C 39,138 34,142 34,152 V 220 Z" />

    <!-- Letter 'o' (right) -->
    <path d="M 120,118 C 152,118 174,141 174,171 C 174,201 152,224 120,224 C 88,224 66,201 66,171 C 66,141 88,118 120,118 Z M 120,138 C 102,138 88,152 88,171 C 88,190 102,204 120,204 C 138,204 152,190 152,171 C 152,152 138,138 120,138 Z" />
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="16" y1="334" x2="496" y2="334" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

  <!-- Bottom Section: Card Icon & "CRM" -->
  <g transform="translate(96, 350)">
    <!-- White CRM Card -->
    <g filter="url(#dropShadow)">
      <rect x="0" y="0" width="118" height="118" rx="28" fill="#FFFFFF" />
      
      <!-- User Avatars inside Card -->
      <!-- Left User -->
      <circle cx="38" cy="40" r="8" fill="#5B92FF" />
      <path d="M 26,62 C 26,52 32,48 38,48 C 44,48 50,52 50,62 Z" fill="#5B92FF" />

      <!-- Center Main User -->
      <circle cx="59" cy="34" r="13" fill="#1256FF" />
      <path d="M 37,65 C 37,51 47,46 59,46 C 71,46 81,51 81,65 Z" fill="#1256FF" />

      <!-- Right User -->
      <circle cx="80" cy="40" r="8" fill="#5B92FF" />
      <path d="M 68,62 C 68,52 74,48 80,48 C 86,48 92,52 92,62 Z" fill="#5B92FF" />

      <!-- Document Lines -->
      <rect x="18" y="72" width="42" height="6" rx="3" fill="#8BB3FF" />
      <rect x="18" y="83" width="28" height="6" rx="3" fill="#8BB3FF" />

      <!-- Checkmark Badge -->
      <circle cx="94" cy="94" r="22" fill="#0353FF" />
      <path d="M 83,94 L 90,101 L 105,86" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- "CRM" Text -->
    <text x="142" y="88" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="68" fill="#B3D3FF" letter-spacing="2">CRM</text>
  </g>
</svg>
